<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffused Lemon - AI Image Generator</title>
  <meta name="license" content="Public Domain">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Diffused Lemon</h1>
      <div class="status-bar">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Connecting...</span>
        <span id="serverInfo" class="server-info"></span>
      </div>
    </header>

    <div class="main-content">
        <aside class="sidebar">
          <div class="card">
            <h2>Settings</h2>
            <div class="form-group">
              <label for="modelSelect">Model</label>
              <select id="modelSelect">
                <option value="">Loading models...</option>
              </select>
            </div>

          <div class="form-group">
              <label for="promptInput">Prompt</label>
              <textarea id="promptInput" placeholder="Describe the image you want to generate..."></textarea>
            </div>

          <div class="button-group">
            <button id="promptAssistBtn" class="secondary">
              🎨 Prompt Assist
            </button>
            <button id="generateBtn" class="primary">
              Generate
            </button>
          </div>

          <div class="button-group" style="margin-top: 10px;">
             <button id="unloadModelBtn" class="secondary">
               🧹 Unload Model
             </button>
          </div>

          <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="card">
          <h2>Parameters</h2>
          <div class="form-group">
             <label for="sizeHeight">Height</label>
             <select id="heightSelect">
               <option value="1024">1024</option>
               <option value="768">768</option>
               <option value="640">640</option>
               <option value="512">512</option>
               <option value="384">384</option>
               <option value="256">256</option>
               <option value="128">128</option>
               <option value="64">64</option>
             </select>
           </div>

           <div class="form-group">
             <label for="sizeWidth">Width</label>
             <select id="widthSelect">
               <option value="1024">1024</option>
               <option value="768">768</option>
               <option value="640">640</option>
               <option value="512">512</option>
               <option value="384">384</option>
               <option value="256">256</option>
               <option value="128">128</option>
               <option value="64">64</option>
             </select>
           </div>

           <div class="form-group">
             <label for="stepsDropdown">Steps (optional)</label>
             <select id="stepsDropdown">
               <option value="">Auto</option>
               <option value="1">1</option>
               <option value="2">2</option>
               <option value="3">3</option>
               <option value="4">4</option>
               <option value="5">5</option>
               <option value="6">6</option>
               <option value="7">7</option>
               <option value="8">8</option>
               <option value="9">9</option>
               <option value="10">10</option>
               <option value="11">11</option>
               <option value="12">12</option>
               <option value="13">13</option>
               <option value="14">14</option>
               <option value="15">15</option>
               <option value="16">16</option>
               <option value="17">17</option>
               <option value="18">18</option>
               <option value="19">19</option>
               <option value="20">20</option>
               <option value="25">25</option>
               <option value="30">30</option>
               <option value="35">35</option>
               <option value="40">40</option>
               <option value="45">45</option>
               <option value="50">50</option>
             </select>
           </div>

           <div class="form-group">
             <label for="seedInput">Seed</label>
             <input type="number" id="seedInput" placeholder="Random" min="0">
             <button id="randomSeedBtn" class="secondary" style="margin-top: 5px; width: 100%; padding: 8px; font-size: 0.9rem;">
               🎲 Random Seed
             </button>
           </div>

           <div class="form-group">
             <label for="cfgInput">CFG Scale (optional)</label>
             <input type="number" id="cfgInput" placeholder="Optional" min="0" step="0.1" max="4.0">
           </div>
          </div>

        <div class="card">
          <h2>Image History</h2>
          <div class="history-grid" id="historyGrid">
            <p class="placeholder" style="grid-column: 1/-1;">No images yet</p>
          </div>
          <div id="loadingMore" style="display: none; text-align: center; padding: 20px; color: var(--text-light);">Loading more...</div>
          <div id="scrollSentinel" style="height: 1px;"></div>
        </div>
      </aside>

       <main class="image-display">
         <div class="card image-container">
           <div class="placeholder" id="placeholderText">No image generated yet</div>
           <img id="generatedImage" class="generated-image" style="display: none;">
           <div class="spinner" id="spinner" style="display: none;"></div>
         </div>

         <div class="card">
           <h2>Image Info</h2>
           <div id="imageInfo">
             <p class="placeholder">Generation details will appear here</p>
           </div>
           <div class="button-group" id="downloadButtons" style="margin-top: 15px;">
             <button id="downloadBtn" class="primary" style="display: none;">
               ⬇ Download
             </button>
           </div>
         </div>
        </main>
   </div>

 <script src="app.js"></script>
</body>
</html>
